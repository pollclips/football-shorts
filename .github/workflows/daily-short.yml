name: Daily football Short

on:
  schedule:
    # twee video's per dag: run om 12:20 (online 13:00) en 21:20 (online 22:00) Brusselse tijd.
    # GitHub rekent in UTC; per slot een start voor zomer- en winteruur, het script laat de verkeerde vallen.
    - cron: "20 10 * * *"   # 12:20 Brussel zomeruur
    - cron: "20 11 * * *"   # 12:20 Brussel winteruur
    - cron: "20 19 * * *"   # 21:20 Brussel zomeruur
    - cron: "20 20 * * *"   # 21:20 Brussel winteruur
  workflow_dispatch:
    inputs:
      slot:
        description: "auto = volgens het uur · 13 = video voor 13:00 (wedstrijden van gisteren) · 22 = video voor 22:00 (van vandaag)"
        type: choice
        options: [auto, "13", "22"]
        default: auto
      mode:
        description: "auto = nieuwe video · test = voorbeeldvideo naar Make · dry-run = enkel maken · preview = maken en in previews/ bewaren, niet posten"
        type: choice
        options: [auto, test, dry-run, preview]
        default: auto
      force:
        description: "Opnieuw maken, ook als er vandaag al een video is"
        type: boolean
        default: false
      day:
        description: "(enkel dry-run/preview) andere dag, bv. 2026-10-23"
        type: string
        default: ""
      voice:
        description: "(optioneel) andere stem, bv. am_michael, bm_george, af_heart"
        type: string
        default: ""
      samples:
        description: "(enkel preview) ook korte stemvoorbeelden maken"
        type: boolean
        default: false
      style:
        description: "vormgeving: broadcast (nieuw) of classic"
        type: choice
        options: [broadcast, classic]
        default: broadcast

permissions:
  contents: write

concurrency:
  group: daily-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'auto' }}
      FORCE: ${{ inputs.force && '1' || '' }}
      DAY: ${{ inputs.day || '' }}
      SLOT: ${{ (inputs.slot && inputs.slot != 'auto') && inputs.slot || '' }}
      MEDIA_BRANCH: media
      VOICE: ${{ inputs.voice || vars.VOICE || 'am_michael' }}
      STYLE: ${{ inputs.style || vars.STYLE || 'broadcast' }}
      SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # apt bleef soms een half uur hangen; daarom met tijdslimiet en een reserve (statische ffmpeg van GitHub)
      - name: ffmpeg installeren
        timeout-minutes: 8
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -1; exit 0; fi
          for i in 1 2; do
            if timeout 120 sudo apt-get update -qq -o Acquire::Retries=2 && \
               timeout 180 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then
              ffmpeg -version | head -1; exit 0
            fi
            echo "apt-poging $i mislukt"
          done
          echo "apt lukt niet; statische ffmpeg downloaden"
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1

      - name: Python-pakketten installeren
        timeout-minutes: 5
        run: pip install -r requirements.txt

      # stem: mag mislukken, dan komt er een video zonder stem (met ondertitels)
      - name: Stemmodel uit cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-timed-1

      - name: Stem installeren
        continue-on-error: true
        timeout-minutes: 6
        run: |
          pip install -r requirements-voice.txt
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "models/$f" ] || curl -fsSL --retry 3 -o "models/$f" \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/$f"
          done
          ls -la models
          pip show kokoro-onnx | head -2

      - name: Video maken
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          mkdir -p out
          python -m shorts.main 2>&1 | tee out/run.log

      - name: Stemvoorbeelden maken
        if: env.MODE == 'preview' && inputs.samples
        continue-on-error: true
        run: python -m shorts.voice samples 2>&1 | tee -a out/run.log

      # geschiedenis (welke wedstrijden al gebruikt zijn) op deze tak; de video's zelf niet (te groot)
      - name: Geschiedenis opslaan
        if: env.MODE != 'preview' && env.MODE != 'dry-run'
        run: |
          git config user.name "football-shorts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u videos
          [ -f history.json ] && git add history.json
          if git diff --cached --quiet; then
            echo "Niets nieuws om op te slaan."
          else
            git commit -m "Short $(date -u +%F' '%H:%M)"
            git pull --rebase -q origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # video op de tak 'media': die wordt telkens vervangen en houdt enkel de laatste dagen bij,
      # zodat de repository niet blijft groeien. Make haalt de video daar op (raw-link).
      - name: Video naar media-tak
        if: env.MODE != 'preview' && env.MODE != 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/video_name ] || { echo "Geen nieuwe video."; exit 0; }
          NAME=$(cat out/video_name)
          M=$(mktemp -d); cd "$M"
          git init -q -b media
          git config user.name "football-shorts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p videos
          if git fetch -q --depth=1 origin media 2>/dev/null; then git checkout -q FETCH_HEAD -- videos 2>/dev/null || true; fi
          cp "$GITHUB_WORKSPACE/videos/$NAME" videos/
          python3 -c "import datetime as d,pathlib as p;c=d.date.today()-d.timedelta(days=4);[f.unlink() for f in p.Path('videos').glob('*.mp4') if f.name[:4].isdigit() and d.date.fromisoformat(f.name[:10])<c]"
          git add -A videos
          git commit -q --allow-empty -m "media $NAME"
          git push -q -f origin HEAD:media
          ls -la videos

      # preview: video + logboek in previews/ op deze tak (ook als er iets misliep, om te kunnen nakijken)
      - name: Preview opslaan in de repository
        if: always() && env.MODE == 'preview'
        run: |
          git config user.name "football-shorts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p previews
          [ -f out/run.log ] && cp out/run.log previews/last-run.log
          git add -A previews
          if git diff --cached --quiet; then
            echo "Niets nieuws om op te slaan."
          else
            git commit -m "Preview $(date -u +%F' '%H:%M)"
            git pull --rebase -q origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Naar Make sturen (YouTube)
        if: env.MODE != 'dry-run' && env.MODE != 'preview'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python -m shorts.send

      - name: Video als download bewaren (7 dagen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            out/latest.mp4
            out/story.json
            out/payload.json
            out/run.log
          if-no-files-found: ignore
          retention-days: 7
