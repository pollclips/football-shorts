name: Daily football Short

on:
  schedule:
    - cron: "20 21 * * *"   # = 23:20 Brussel tijdens zomeruur
    - cron: "20 22 * * *"   # = 23:20 Brussel tijdens winteruur
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = video van vandaag · test = voorbeeldvideo naar Make · dry-run = enkel maken, niet posten"
        type: choice
        options: [auto, test, dry-run]
        default: auto
      force:
        description: "Opnieuw maken, ook als er vandaag al een video is"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'auto' }}
      FORCE: ${{ inputs.force && '1' || '' }}
      SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python-pakketten installeren
        run: pip install -r requirements.txt

      - name: Video maken
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m shorts.main

      - name: Video opslaan in de repository
        run: |
          git config user.name "football-shorts-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A videos
          [ -f history.json ] && git add history.json
          if git diff --cached --quiet; then
            echo "Niets nieuws om op te slaan."
          else
            git commit -m "Short $(date -u +%F)"
            git push
          fi

      - name: Naar Make sturen (YouTube)
        if: env.MODE != 'dry-run'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python -m shorts.send

      - name: Video als download bewaren (7 dagen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            out/latest.mp4
            out/story.json
            out/payload.json
          if-no-files-found: ignore
          retention-days: 7
